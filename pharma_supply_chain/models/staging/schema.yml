version: 2

models:
  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

      - name: unit_price
        data_tests:
          - not_null

  - name: stg_suppliers
    columns:
      - name: supplier_id
        data_tests:
          - unique
          - not_null

  - name: stg_inventory
    columns:
      - name: inventory_id
        data_tests:
          - unique
          - not_null

      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_shipments
    columns:
      - name: shipment_id
        data_tests:
          - unique
          - not_null

      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_sales
    columns:
      - name: sale_id
        data_tests:
          - unique
          - not_null

      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id